  </head>
  <body>
    <!-- Google Translate Widget (Fully visible to ensure initialization) -->
    <div id="google_translate_element"></div>
    <script>
      // Force reset language to Vietnamese on every page reload, UNLESS programmatic
      if (!sessionStorage.getItem('xuanhien_keep_lang')) {
        var hostname = window.location.hostname;
        var domains = ['', '.' + hostname, hostname];
        var parts = hostname.split('.');
        if (parts.length > 1) {
          domains.push('.' + parts[parts.length - 2] + '.' + parts[parts.length - 1]);
        }
        domains.forEach(function(d) {
          var domainStr = d ? '; domain=' + d : '';
          document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/' + domainStr;
        });
      }
      // Reset the flag so next manual F5 will clear it
      sessionStorage.removeItem('xuanhien_keep_lang');
    </script>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'vi',
          includedLanguages: 'en,vi', // Only English and Vietnamese
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
